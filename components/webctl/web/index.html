<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LED Panel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d0f14; color: #e8eaf0;
    max-width: 480px; margin: 0 auto; padding: 16px 14px 40px;
  }
  h1 { font-size: 1.15rem; margin-bottom: 2px; }
  .sub { color: #7a8194; font-size: 0.8rem; margin-bottom: 16px; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
       color: #9aa3b8; margin: 20px 0 8px; }
  .anims { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .anims button {
    padding: 12px 8px; border: 1px solid #2a2f3d; border-radius: 10px;
    background: #171b24; color: #e8eaf0; font-size: 0.9rem; cursor: pointer;
  }
  .anims button.active { background: #2f5cff; border-color: #2f5cff; font-weight: 600; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .slider-row label { width: 78px; font-size: 0.85rem; color: #9aa3b8; }
  .slider-row input { flex: 1; accent-color: #2f5cff; }
  #grid { display: block; width: 100%; aspect-ratio: 1;
    border: 1px solid #2a2f3d; border-radius: 8px; touch-action: none;
    image-rendering: pixelated; background: #000; }
  .tools { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .tools button {
    padding: 8px 14px; border: 1px solid #2a2f3d; border-radius: 8px;
    background: #171b24; color: #e8eaf0; font-size: 0.85rem; cursor: pointer;
  }
  .tools button.primary { background: #2f5cff; border-color: #2f5cff; font-weight: 600; }
  #color { width: 42px; height: 36px; border: none; background: none; cursor: pointer; }
  .swatches { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .swatches div { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2a2f3d; cursor: pointer; }
  #stat { color: #7a8194; font-size: 0.75rem; margin-top: 14px; }
  label.live { font-size: 0.85rem; color: #9aa3b8; display: flex; align-items: center; gap: 6px; }
  .txt {
    width: 100%; padding: 10px 12px; margin: 4px 0;
    border: 1px solid #2a2f3d; border-radius: 8px;
    background: #171b24; color: #e8eaf0; font-size: 0.9rem;
  }
  #wifiinfo { color: #7a8194; font-size: 0.8rem; margin-bottom: 6px; }
</style>
</head>
<body>
  <h1>LED Panel</h1>
  <div class="sub">32 &times; 32 &middot; ESP32-S3</div>

  <h2>Animations</h2>
  <div class="anims" id="anims"></div>

  <h2>Settings</h2>
  <div class="slider-row">
    <label>Brightness</label>
    <input type="range" id="brightness" min="5" max="255" value="160">
  </div>
  <div class="slider-row">
    <label>Speed</label>
    <input type="range" id="speed" min="16" max="255" value="128">
  </div>

  <h2>Pixel Art</h2>
  <canvas id="grid" width="32" height="32"></canvas>
  <div class="swatches" id="swatches"></div>
  <div class="tools">
    <input type="color" id="color" value="#ff2040">
    <button id="fill">Fill</button>
    <button id="clear">Clear</button>
    <button id="loadimg">Image&hellip;</button>
    <button id="send" class="primary">Send</button>
    <label class="live"><input type="checkbox" id="live"> live</label>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <h2>WiFi</h2>
  <div id="wifiinfo">&hellip;</div>
  <input class="txt" id="ssid" placeholder="Network name (SSID)" maxlength="32"
         autocapitalize="off" autocorrect="off" autocomplete="off">
  <input class="txt" id="wpass" type="password" placeholder="Password" maxlength="64">
  <div class="tools">
    <button id="wifisave" class="primary">Save &amp; restart panel</button>
  </div>

  <div id="stat">connecting&hellip;</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const W = 32, H = 32;
const cv = $('grid'), cx = cv.getContext('2d');
let pixels = new Uint8Array(W * H * 3);
let erase = false;

const SWATCHES = ['#ff2040','#ff8000','#ffd000','#30ff40','#00e0ff','#2f5cff',
                  '#b040ff','#ff40c0','#ffffff','#000000'];
SWATCHES.forEach(c => {
  const d = document.createElement('div');
  d.style.background = c;
  d.onclick = () => { $('color').value = c; };
  $('swatches').appendChild(d);
});

function redraw() {
  const img = cx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    img.data[i*4] = pixels[i*3];
    img.data[i*4+1] = pixels[i*3+1];
    img.data[i*4+2] = pixels[i*3+2];
    img.data[i*4+3] = 255;
  }
  cx.putImageData(img, 0, 0);
}

function paint(ev) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / r.width * W);
  const y = Math.floor((ev.clientY - r.top) / r.height * H);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const c = hex($('color').value);
  const i = (y * W + x) * 3;
  pixels[i] = c[0]; pixels[i+1] = c[1]; pixels[i+2] = c[2];
  redraw();
  if ($('live').checked) sendFrameSoon();
}

function hex(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

let drawing = false;
cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); paint(e); });
cv.addEventListener('pointermove', e => { if (drawing) paint(e); });
cv.addEventListener('pointerup', () => { drawing = false; });

$('fill').onclick = () => {
  const c = hex($('color').value);
  for (let i = 0; i < W * H; i++) { pixels[i*3] = c[0]; pixels[i*3+1] = c[1]; pixels[i*3+2] = c[2]; }
  redraw();
  if ($('live').checked) sendFrameSoon();
};
$('clear').onclick = () => { pixels.fill(0); redraw(); if ($('live').checked) sendFrameSoon(); };
$('send').onclick = sendFrame;

// Load an image file (e.g. a game sprite), scale it to 32x32 with
// nearest-neighbor sampling (no smoothing, keeps pixel art crisp),
// letterboxed to preserve aspect ratio, then send it to the panel.
$('loadimg').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const img = await createImageBitmap(f);
    const oc = document.createElement('canvas');
    oc.width = W; oc.height = H;
    const o = oc.getContext('2d');
    o.imageSmoothingEnabled = false;
    const s = Math.min(W / img.width, H / img.height);
    const dw = Math.max(1, Math.round(img.width * s));
    const dh = Math.max(1, Math.round(img.height * s));
    o.drawImage(img, Math.floor((W - dw) / 2), Math.floor((H - dh) / 2), dw, dh);
    const d = o.getImageData(0, 0, W, H).data;
    for (let i = 0; i < W * H; i++) {
      pixels[i*3] = d[i*4];
      pixels[i*3+1] = d[i*4+1];
      pixels[i*3+2] = d[i*4+2];
    }
    redraw();
    sendFrame();
  } catch (err) { stat('could not load image'); }
  e.target.value = '';
};

let sendTimer = null;
function sendFrameSoon() {
  if (sendTimer) return;
  sendTimer = setTimeout(() => { sendTimer = null; sendFrame(); }, 120);
}
async function sendFrame() {
  try {
    await fetch('/api/frame', { method: 'POST', body: pixels });
    refreshSoon();
  } catch (e) { stat('send failed'); }
}

// ---- state / animations ----
let current = -1;

function stat(t) { $('stat').textContent = t; }

async function setState(obj) {
  try { await fetch('/api/state', { method: 'POST', body: JSON.stringify(obj) }); }
  catch (e) { stat('offline?'); }
}

function renderAnims(names) {
  const box = $('anims');
  box.innerHTML = '';
  names.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = i === current ? 'active' : '';
    b.onclick = () => { current = i; renderSel(); setState({ anim: i }); };
    box.appendChild(b);
  });
}
function renderSel() {
  [...$('anims').children].forEach((b, i) => b.className = i === current ? 'active' : '');
}

$('brightness').oninput = throttle(() => setState({ brightness: +$('brightness').value }), 150);
$('speed').oninput = throttle(() => setState({ speed: +$('speed').value }), 150);

function throttle(fn, ms) {
  let t = null;
  return () => { if (!t) t = setTimeout(() => { t = null; fn(); }, ms); };
}

let refreshTimer = null;
function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 300); }

async function refresh(full) {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (full) {
      renderAnims(s.animations);
      $('brightness').value = s.brightness;
      $('speed').value = s.speed;
    }
    current = s.anim;
    renderSel();
    stat(`${s.animations[s.anim]} · ~${(s.ma/1000).toFixed(1)} A`);
  } catch (e) { stat('offline?'); }
}

// ---- wifi provisioning ----
let hostname = 'ledpanel';

async function loadWifi() {
  try {
    const w = await (await fetch('/api/wifi')).json();
    hostname = w.hostname || hostname;
    $('wifiinfo').textContent = w.mode === 'ap'
      ? 'Access-point mode — the panel is not on your WiFi yet. Enter your network below.'
      : `Connected to "${w.ssid}" — ${w.ip} · http://${w.hostname}.local`;
    if (w.ssid && !$('ssid').value) $('ssid').value = w.ssid;
  } catch (e) {}
}

$('wifisave').onclick = async () => {
  const ssid = $('ssid').value.trim();
  const pass = $('wpass').value;
  if (ssid && pass && pass.length < 8) {
    $('wifiinfo').textContent = 'WiFi passwords are at least 8 characters.';
    return;
  }
  if (!ssid && !confirm('Empty network name clears the saved WiFi settings. Continue?')) return;
  try {
    const r = await fetch('/api/wifi', { method: 'POST',
      body: JSON.stringify({ ssid, password: pass }) });
    if (!r.ok) { $('wifiinfo').textContent = 'Rejected: ' + await r.text(); return; }
    $('wifiinfo').textContent = ssid
      ? `Saved. The panel is restarting and joining "${ssid}" — ` +
        `reconnect your phone to that network, then open http://${hostname}.local`
      : 'Cleared. The panel is restarting.';
  } catch (e) { $('wifiinfo').textContent = 'Could not reach the panel.'; }
};

redraw();
refresh(true);
loadWifi();
setInterval(() => refresh(false), 4000);
</script>
</body>
</html>
