<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#110911">
<title>Mosaik</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  /* The Shei Designs fonts, served by the panel itself (in access-point mode
     the phone has no internet). SIL OFL, see fonts/licenses/. */
  @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(/fonts/inter-400.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(/fonts/inter-600.woff2) format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 500; font-display: swap; src: url(/fonts/space-grotesk-500.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: swap; src: url(/fonts/jetbrains-mono-400.woff2) format('woff2'); }

  :root {
    /* The Shei Designs surfaces (Carbon, Slate, Iron, Linen, Dust) tinted a
       few percent toward Mosaik's own Pixel purple. Two accents: the purple
       is Mosaik's identity (what is selected, active, focused), Tape is the
       house signal (the action to take). They never share a control. */
    --bg: #110911;
    --panel: #1c1319;
    --control: #271c23;
    --control-hover: #33252d;
    --border: #32252b;
    --text: #e7ded9;
    --muted: #8c8085;
    --accent: #c414ff;
    --signal: #ff6b1a;
    --signal-strong: #ff8440;
    --on-signal: #0a0907;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font: 400 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto; padding: 20px 16px 32px;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header: the tile and the product name, set in Space Grotesk as Shei
     Designs sets product names (and nothing else). */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header img { width: 44px; height: 44px; }
  h1 { font: 500 28px/1.1 'Space Grotesk', Inter, sans-serif; letter-spacing: -0.01em; }
  .sub { font: 12px/1.4 var(--mono); color: var(--muted); }

  h2 { font: 400 12px/1 var(--mono); color: var(--muted); margin: 28px 0 10px; }

  .anims { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .anims button {
    padding: 11px 8px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); font-size: 14px;
  }
  .anims button:hover { background: var(--control); }
  .anims button.active {
    border-color: var(--accent); font-weight: 600;
    background: color-mix(in srgb, var(--accent) 16%, var(--control));
  }

  .slider-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .slider-row label { width: 84px; font-size: 14px; color: var(--muted); }
  .slider-row input { flex: 1; accent-color: var(--accent); }

  #grid { display: block; width: 100%; aspect-ratio: 1;
    border: 1px solid var(--border); border-radius: 8px; touch-action: none;
    image-rendering: pixelated; background: #000; }
  .tools { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .tools button {
    height: 36px; padding: 0 14px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--control); font-size: 14px;
  }
  .tools button:hover:not(:disabled) { background: var(--control-hover); }
  /* The primary action is Tape, the house signal: one colour for "do this"
     across the product line. */
  .tools button.primary { background: var(--signal); border-color: var(--signal); color: var(--on-signal); font-weight: 600; }
  .tools button.primary:hover:not(:disabled) { background: var(--signal-strong); border-color: var(--signal-strong); }
  #color { width: 44px; height: 36px; padding: 2px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--control); cursor: pointer; }
  #color::-webkit-color-swatch-wrapper { padding: 0; }
  #color::-webkit-color-swatch { border: none; border-radius: 4px; }
  #color::-moz-color-swatch { border: none; border-radius: 4px; }
  .swatches { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .swatches div { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
  label.live { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  label.live input { accent-color: var(--accent); }
  .txt {
    width: 100%; padding: 10px 12px; margin: 4px 0;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--control); font-size: 15px;
  }
  .txt::placeholder { color: var(--muted); }
  .txt:focus { outline: none; border-color: var(--accent); }
  #wifiinfo, #fwinfo { color: var(--muted); font-size: 13px; margin-bottom: 6px; }

  footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--border);
    font: 11px/1.5 var(--mono); color: var(--muted); }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <img src="/icon.svg" alt="">
    <div>
      <h1>Mosaik</h1>
      <div class="sub">32 &times; 32 &middot; 1024 pixels</div>
    </div>
  </header>

  <h2>animations</h2>
  <div class="anims" id="anims"></div>

  <h2>settings</h2>
  <div class="slider-row">
    <label for="brightness">Brightness</label>
    <input type="range" id="brightness" min="5" max="255" value="160">
  </div>
  <div class="slider-row">
    <label for="speed">Speed</label>
    <input type="range" id="speed" min="16" max="255" value="128">
  </div>

  <h2>pixel art</h2>
  <canvas id="grid" width="32" height="32"></canvas>
  <div class="swatches" id="swatches"></div>
  <div class="tools">
    <input type="color" id="color" value="#ff2040" aria-label="Paint colour">
    <button id="fill">Fill</button>
    <button id="clear">Clear</button>
    <button id="loadimg">Image&hellip;</button>
    <button id="send" class="primary">Send</button>
    <label class="live"><input type="checkbox" id="live"> live</label>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <h2>wifi</h2>
  <div id="wifiinfo">&hellip;</div>
  <input class="txt" id="ssid" placeholder="Network name (SSID)" maxlength="32"
         autocapitalize="off" autocorrect="off" autocomplete="off">
  <input class="txt" id="wpass" type="password" placeholder="Password" maxlength="64">
  <div class="tools">
    <button id="wifisave" class="primary">Save &amp; restart</button>
  </div>

  <h2>firmware</h2>
  <div id="fwinfo">&hellip;</div>
  <div class="tools">
    <button id="otabtn">Update firmware&hellip;</button>
    <input type="file" id="otafile" accept=".bin" hidden>
  </div>

  <footer>
    <span id="stat">connecting&hellip;</span>
    <a href="https://sheidesigns.com" target="_blank" rel="noopener">a shei designs project</a>
  </footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const W = 32, H = 32;
const cv = $('grid'), cx = cv.getContext('2d');
let pixels = new Uint8Array(W * H * 3);
let erase = false;

const SWATCHES = ['#ff2040','#ff8000','#ffd000','#30ff40','#00e0ff','#2f5cff',
                  '#c414ff','#ff40c0','#ffffff','#000000'];
SWATCHES.forEach(c => {
  const d = document.createElement('div');
  d.style.background = c;
  d.onclick = () => { $('color').value = c; };
  $('swatches').appendChild(d);
});

function redraw() {
  const img = cx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    img.data[i*4] = pixels[i*3];
    img.data[i*4+1] = pixels[i*3+1];
    img.data[i*4+2] = pixels[i*3+2];
    img.data[i*4+3] = 255;
  }
  cx.putImageData(img, 0, 0);
}

function paint(ev) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / r.width * W);
  const y = Math.floor((ev.clientY - r.top) / r.height * H);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const c = hex($('color').value);
  const i = (y * W + x) * 3;
  pixels[i] = c[0]; pixels[i+1] = c[1]; pixels[i+2] = c[2];
  redraw();
  if ($('live').checked) sendFrameSoon();
}

function hex(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

let drawing = false;
cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); paint(e); });
cv.addEventListener('pointermove', e => { if (drawing) paint(e); });
cv.addEventListener('pointerup', () => { drawing = false; });

$('fill').onclick = () => {
  const c = hex($('color').value);
  for (let i = 0; i < W * H; i++) { pixels[i*3] = c[0]; pixels[i*3+1] = c[1]; pixels[i*3+2] = c[2]; }
  redraw();
  if ($('live').checked) sendFrameSoon();
};
$('clear').onclick = () => { pixels.fill(0); redraw(); if ($('live').checked) sendFrameSoon(); };
$('send').onclick = sendFrame;

// Load an image file (e.g. a game sprite), scale it to 32x32 with
// nearest-neighbor sampling (no smoothing, keeps pixel art crisp),
// letterboxed to preserve aspect ratio, then send it to the panel.
$('loadimg').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const img = await createImageBitmap(f);
    const oc = document.createElement('canvas');
    oc.width = W; oc.height = H;
    const o = oc.getContext('2d');
    o.imageSmoothingEnabled = false;
    const s = Math.min(W / img.width, H / img.height);
    const dw = Math.max(1, Math.round(img.width * s));
    const dh = Math.max(1, Math.round(img.height * s));
    o.drawImage(img, Math.floor((W - dw) / 2), Math.floor((H - dh) / 2), dw, dh);
    const d = o.getImageData(0, 0, W, H).data;
    for (let i = 0; i < W * H; i++) {
      pixels[i*3] = d[i*4];
      pixels[i*3+1] = d[i*4+1];
      pixels[i*3+2] = d[i*4+2];
    }
    redraw();
    sendFrame();
  } catch (err) { stat('could not load image'); }
  e.target.value = '';
};

let sendTimer = null;
function sendFrameSoon() {
  if (sendTimer) return;
  sendTimer = setTimeout(() => { sendTimer = null; sendFrame(); }, 120);
}
async function sendFrame() {
  try {
    await fetch('/api/frame', { method: 'POST', body: pixels });
    refreshSoon();
  } catch (e) { stat('send failed'); }
}

// ---- state / animations ----
let current = -1;

function stat(t) { $('stat').textContent = t; }

async function setState(obj) {
  try { await fetch('/api/state', { method: 'POST', body: JSON.stringify(obj) }); }
  catch (e) { stat('offline?'); }
}

function renderAnims(names) {
  const box = $('anims');
  box.innerHTML = '';
  names.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.className = i === current ? 'active' : '';
    b.onclick = () => { current = i; renderSel(); setState({ anim: i }); };
    box.appendChild(b);
  });
}
function renderSel() {
  [...$('anims').children].forEach((b, i) => b.className = i === current ? 'active' : '');
}

$('brightness').oninput = throttle(() => setState({ brightness: +$('brightness').value }), 150);
$('speed').oninput = throttle(() => setState({ speed: +$('speed').value }), 150);

function throttle(fn, ms) {
  let t = null;
  return () => { if (!t) t = setTimeout(() => { t = null; fn(); }, ms); };
}

let refreshTimer = null;
function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 300); }

async function refresh(full) {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (full) {
      renderAnims(s.animations);
      $('brightness').value = s.brightness;
      $('speed').value = s.speed;
    }
    current = s.anim;
    renderSel();
    if (s.version && !otaBusy) $('fwinfo').textContent = `Running version ${s.version}`;
    stat(`${s.animations[s.anim]} · ~${(s.ma/1000).toFixed(1)} A`);
  } catch (e) { stat('offline?'); }
}

// ---- wifi provisioning ----
let hostname = 'mosaik';

async function loadWifi() {
  try {
    const w = await (await fetch('/api/wifi')).json();
    hostname = w.hostname || hostname;
    $('wifiinfo').textContent = w.mode === 'ap'
      ? 'Access-point mode: Mosaik is not on your WiFi yet. Enter your network below.'
      : `Connected to "${w.ssid}" · ${w.ip} · http://${w.hostname}.local`;
    if (w.ssid && !$('ssid').value) $('ssid').value = w.ssid;
  } catch (e) {}
}

$('wifisave').onclick = async () => {
  const ssid = $('ssid').value.trim();
  const pass = $('wpass').value;
  if (ssid && pass && pass.length < 8) {
    $('wifiinfo').textContent = 'WiFi passwords are at least 8 characters.';
    return;
  }
  if (!ssid && !confirm('Empty network name clears the saved WiFi settings. Continue?')) return;
  try {
    const r = await fetch('/api/wifi', { method: 'POST',
      body: JSON.stringify({ ssid, password: pass }) });
    if (!r.ok) { $('wifiinfo').textContent = 'Rejected: ' + await r.text(); return; }
    $('wifiinfo').textContent = ssid
      ? `Saved. Mosaik is restarting and joining "${ssid}". ` +
        `Reconnect your phone to that network, then open http://${hostname}.local`
      : 'Cleared. Mosaik is restarting.';
  } catch (e) { $('wifiinfo').textContent = 'Could not reach Mosaik.'; }
};

// ---- firmware update ----
let otaBusy = false;

$('otabtn').onclick = () => $('otafile').click();
$('otafile').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!confirm(`Flash "${f.name}" (${(f.size/1024).toFixed(0)} KB) to Mosaik?`)) return;

  otaBusy = true;
  $('otabtn').disabled = true;
  const info = t => { $('fwinfo').textContent = t; };

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/ota');
  xhr.upload.onprogress = ev => {
    if (ev.lengthComputable) info(`Uploading… ${(ev.loaded/ev.total*100).toFixed(0)} %`);
  };
  xhr.onload = () => {
    if (xhr.status === 200) {
      info('Flashed. Mosaik is restarting; this page reloads in 15 s.');
      setTimeout(() => location.reload(), 15000);
    } else {
      info('Update rejected: ' + xhr.responseText);
      otaBusy = false;
      $('otabtn').disabled = false;
    }
  };
  xhr.onerror = () => {
    info('Upload failed and nothing was changed. Check the connection and retry.');
    otaBusy = false;
    $('otabtn').disabled = false;
  };
  xhr.send(f);
};

redraw();
refresh(true);
loadWifi();
setInterval(() => refresh(false), 4000);
</script>
</body>
</html>
